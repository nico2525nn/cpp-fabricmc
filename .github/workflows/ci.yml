name: cpp-fabricmc CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cppfm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows-timeout-runner:
    name: Windows timeout process-tree regression
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Timeout runner unit and Windows process-tree tests
        timeout-minutes: 2
        run: python -m unittest discover -s tests -p test_run_with_timeout.py -v

  build-and-regress:
    name: Build and non-nightly regression
    runs-on: ubuntu-22.04
    # Explicit step budgets plus TERM grace periods total about 83 minutes.
    # Reserve the remainder for runner setup/dependency installation so the
    # job timeout does not pre-empt live-smoke owned-process cleanup.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js for Mineflayer integration
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/mineflayer/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build g++ pkg-config zlib1g-dev libssl-dev python3

      - name: Configure
        run: |
          timeout --foreground --kill-after=10 120 \
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        id: build
        run: |
          timeout --kill-after=10 1800 \
            cmake --build build -j2

      - name: Install Mineflayer test dependencies
        id: mineflayer_deps
        timeout-minutes: 11
        run: timeout --kill-after=10 600 npm ci --prefix tests/mineflayer

      - name: Verify generated block data
        run: |
          python3 tools/gen_block_registry_ids.py --check
          python3 tools/gen_block_collision_shapes.py --check
          python3 tools/gen_entity_dimensions.py --check

      - name: Static diff check
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --check "$PR_BASE_SHA" "$GITHUB_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && \
               [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          else
            git diff --check "${GITHUB_SHA}^" "$GITHUB_SHA"
          fi

      - name: Deterministic focused gates
        env:
          TMPDIR: /dev/shm
          CPPFM_RECOVERY_WORLD_PREFIX: /dev/shm
        run: |
          mkdir -p /tmp/opencode
          # test_properties uses std::system() for informational subprocesses;
          # let timeout signal its process group so a stalled child is bounded too.
          timeout --kill-after=10 120 ./build/test_properties ./build/cppfm
          timeout --foreground --kill-after=10 180 ./build/test_recovery
          timeout --foreground --kill-after=10 120 ./build/test_core_safety

      - name: Mineflayer live-client regression
        env:
          TMPDIR: /dev/shm
        run: |
          timeout --foreground --kill-after=10 120 \
            npm --prefix tests/mineflayer test
          timeout --kill-after=30 600 \
            npm --prefix tests/mineflayer run live-smoke

      - name: Independent JVM callback-only live probe
        if: ${{ always() && steps.build.outcome == 'success' && steps.mineflayer_deps.outcome == 'success' }}
        env:
          TMPDIR: /dev/shm
        run: |
          timeout --kill-after=30 180 \
            node tests/mineflayer/run.cjs --jvm-callback-only

      - name: Full non-nightly CTest regression
        env:
          TMPDIR: /dev/shm
          CPPFM_RECOVERY_WORLD_PREFIX: /dev/shm
        run: |
          timeout --kill-after=10 1800 \
            ctest --test-dir build \
              -LE nightly --output-on-failure --timeout 600
